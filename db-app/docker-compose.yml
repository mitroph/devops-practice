services:
  db:
    image: postgres:15-alpine
    container_name: db_app
    ports:
    - 5432:5432
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file: ".env"

  api:
    container_name: api_app
    build: 
      context: ./python-api
      # dockerfile: Dockerfile
    depends_on:
      - db
    ports:
    - 5000:5000

volumes:
  pgdata:
