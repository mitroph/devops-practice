services:
  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend_data:/usr/share/nginx/html
    networks:
      - proxy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:80/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: nginx:alpine
    volumes:
      - ./backend_data:/usr/share/nginx/html
    networks:
      - proxy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:80/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway_data/gateway.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 8080:80
    networks:
      - proxy
    depends_on:
      condition: service_healthy - backend - frontend
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:80/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    driver: bridge
