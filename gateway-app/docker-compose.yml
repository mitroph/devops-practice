services:
  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend_data:/usr/share/nginx/html
    networks:
      - proxy

  backend:
    image: nginx:alpine
    volumes:
      - ./backend_data:/usr/share/nginx/html
    networks:
      - proxy

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway_data/gateway.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 8080:80
    networks:
      - proxy

networks:
  proxy:
    driver: bridge
